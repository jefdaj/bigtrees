recommend-stack-upgrade: false

# TODO update directory-tree code too if it has any new work
packages:
  - ./directory-tree
  - .

# TODO does this help?
nix:
  enable: false
  pure: false

# for weeder
# does this also have to be added to each target in package.yaml?
ghc-options:
  "$locals": -fwrite-ide-info

# GHC 9.8.4, which should match the version in flake.nix
resolver: lts-23.26

extra-deps:
  - directory-1.3.8.5
  - unix-2.8.6.0
  - file-io-0.1.5
  - filepath-1.5.4.0
  - process-1.6.25.0
  - filepath-bytestring-1.5.2.0.2@sha256:d410c6e273c926411a9b35009e8c25ef8fe522c49fa6c226365a20dceb96b6e7,3183
  # - docopt-0.7.0.8
  # - os-string-2.0.3
  # - hashable-1.4.6.0
  # - Cabal-syntax-3.10.3.0
  # - Cabal-3.10.3.0

allow-newer: true

allow-newer-deps:
  # - MissingH
  # - directory
  # - file-io
  # - hashable
  # - unix

flags:
  unix:
    os-string: true
  file-io:
    os-string: true
  directory:
    os-string: true
